[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pypay"
version = "0.1.0"
description = "Unified WeChat Pay APIv3 Native and Alipay PC web payment client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pypay contributors" }]
keywords = ["payments", "wechat-pay", "alipay", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "wechatpayv3>=2.0.4,<3",
  "alipay-sdk-python>=3.7.1411,<4",
  "cryptography>=42",
]

[project.optional-dependencies]
examples = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "pytest-cov>=5",
  "ruff>=0.5",
  "fastapi>=0.110",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypay = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/pypay"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
